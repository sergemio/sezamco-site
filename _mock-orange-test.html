<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Orange picker — 8 candidats</title>
<style>
  body { background: #FFF8E1; padding: 2rem; font-family: system-ui, sans-serif; }
  h1 { font-size: 1rem; color: #1A3B06; margin-bottom: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; max-width: 900px; margin: 0 auto; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-weight: 900;
    font-size: 1rem; padding: 1rem;
    text-align: center;
    /* AUCUNE box-shadow pour que le sampling soit pur */
  }
  .swatch code {
    font-family: monospace; font-size: .85rem;
    margin-top: .4rem; opacity: .9;
    background: rgba(0,0,0,.15); padding: .15rem .5rem; border-radius: 4px;
  }
  .swatch .label { font-size: .75rem; opacity: .85; margin-top: .3rem; }
</style>
</head>
<body>
<h1>Pointe celui qui matche ta cible. Sample au CENTRE du carré (pas dans le coin arrondi).</h1>
<div class="grid">
  <div class="swatch" style="background:#E89B2A;">A<code>#E89B2A</code><span class="label">ambre saturé</span></div>
  <div class="swatch" style="background:#EC9C2F;">B<code>#EC9C2F</code><span class="label">amber + 1</span></div>
  <div class="swatch" style="background:#E58A2A;">C<code>#E58A2A</code><span class="label">orange chaud</span></div>
  <div class="swatch" style="background:#E07D35;">D<code>#E07D35</code><span class="label">actuel (pumpkin)</span></div>
  <div class="swatch" style="background:#F49A1A;">E<code>#F49A1A</code><span class="label">amber vif</span></div>
  <div class="swatch" style="background:#D97A1F;">F<code>#D97A1F</code><span class="label">terracotta</span></div>
  <div class="swatch" style="background:#FFA31A;">G<code>#FFA31A</code><span class="label">orange éclatant</span></div>
  <div class="swatch" style="background:#E89134;">H<code>#E89134</code><span class="label">amber moyen</span></div>
</div>
</body>
</html>
